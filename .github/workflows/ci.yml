name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Giao diện
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài phụ thuộc
        working-directory: frontend
        run: npm ci

      - name: Kiểm tra kiểu
        working-directory: frontend
        run: npm run typecheck

      - name: Kiểm tra hai tệp ngôn ngữ khớp khóa
        working-directory: frontend
        run: node scripts/check-locales.mjs

      - name: Build
        working-directory: frontend
        run: npm run build

      # Backend nhúng thư mục này vào binary, nên các job sau cần dùng lại.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Kiểm tra định dạng
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Các tệp sau chưa được gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint từ chối chạy khi bản thân nó dựng bằng Go cũ hơn phiên bản
      # mô-đun nhắm tới, nên bản được ghim ở đây phải là bản dựng bằng Go 1.25
      # trở lên — và action phải là v8 vì bản v6 chỉ cài được golangci-lint 1.x.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Độ phủ
        run: go tool cover -func=coverage.out | tail -1

  desktop:
    name: Ứng dụng máy tính
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: desktop/go.sum

      # Trình duyệt nhúng là thư viện hệ thống, nên không biên dịch chéo được:
      # job này chỉ kiểm được bản Linux, Windows và macOS phải build trên chính nó.
      - name: Cài WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Kiểm tra định dạng
        working-directory: desktop
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Các tệp sau chưa được gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        working-directory: desktop
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/desktop/pkgconfig
        run: |
          go vet ./...
          go test ./...

      - name: Build
        working-directory: desktop
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/desktop/pkgconfig
        run: go build -trimpath -o /tmp/sunpanel-desktop .

  android:
    name: Ứng dụng Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Một lượt Gradle duy nhất cho cả test lẫn build: mỗi lần gọi lại là thêm
      # một vòng cấu hình và tải phụ thuộc, mà đó mới là phần tốn thời gian.
      #
      # Phần xử lý danh sách máy chủ và địa chỉ panel viết thuần Kotlin nên bài
      # kiểm thử chạy thẳng trên JVM, không cần máy ảo Android.
      - name: Test và build
        working-directory: mobile/android
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sunpanel-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # CGO_ENABLED=0 là bắt buộc: driver SQLite thuần Go cho phép biên dịch chéo
      # mọi nền tảng từ một runner Linux duy nhất.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          output="sunpanel-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && output="${output}.exe"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::7} -X main.commit=${GITHUB_SHA::7}" \
            -o "dist/$output" ./cmd/sunpanel

      - uses: actions/upload-artifact@v4
        with:
          name: sunpanel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  smoke:
    name: Chạy thử
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sunpanel-linux-amd64

      # Kiểm tra binary thật sự khởi động được và phục vụ API, chứ không chỉ
      # biên dịch xong là coi như đạt.
      - name: Khởi động panel và gọi thử API
        run: |
          chmod +x sunpanel-linux-amd64
          SUNPANEL_DATA_DIR="$PWD/data" SUNPANEL_PORT=19527 \
            ./sunpanel-linux-amd64 serve > server.log 2>&1 &

          for i in $(seq 1 30); do
            grep -q 'SunPanel đã khởi động' server.log && break
            sleep 1
          done

          entry=$(grep -oP 'bí mật: /\K[^/]+' server.log)
          [ -n "$entry" ] || { echo "Không đọc được đường dẫn bí mật"; cat server.log; exit 1; }

          # Đường dẫn không có tiền tố bí mật phải trả về 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:19527/api/v1/health")
          [ "$code" = "404" ] || { echo "Đường dẫn không có tiền tố trả về $code, mong đợi 404"; exit 1; }

          # Đường dẫn đúng phải trả về JSON thành công.
          curl -fsS "http://127.0.0.1:19527/$entry/api/v1/health" | grep -q '"success":true'

          # Giao diện phải được phục vụ từ trong binary.
          curl -fsS "http://127.0.0.1:19527/$entry/" | grep -q '<base href='

          echo "Chạy thử đạt"
