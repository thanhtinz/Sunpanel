key: wordpress
name:
  vi: WordPress
  en: WordPress
description:
  vi: "Nền tảng viết blog và làm website phổ biến nhất, kèm sẵn cơ sở dữ liệu MariaDB."
  en: "The most widely used blogging and website platform, with a MariaDB database included."
category: website
website: https://wordpress.org
portField: HTTP_PORT
versions:
  - name: "7.0.4"
    images:
      - wordpress:7.0.4-apache
      - mariadb:11
    values:
      IMAGE: "wordpress:7.0.4-apache"
      DB_IMAGE: "mariadb:11"
  - name: "6.9.4"
    images:
      - wordpress:6.9.4-apache
      - mariadb:11
    values:
      IMAGE: "wordpress:6.9.4-apache"
      DB_IMAGE: "mariadb:11"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8090"
    required: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        WORDPRESS_DB_HOST: db
        WORDPRESS_DB_NAME: wordpress
        WORDPRESS_DB_USER: wordpress
        WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/www/html

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: wordpress
        MARIADB_USER: wordpress
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "1"
      volumes:
        - db:/var/lib/mysql

  volumes:
    data:
    db:
