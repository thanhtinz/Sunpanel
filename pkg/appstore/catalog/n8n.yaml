key: n8n
name:
  vi: n8n
  en: n8n
description:
  vi: "Tự động hóa quy trình bằng cách nối các dịch vụ lại với nhau, không cần viết mã."
  en: "Workflow automation that wires services together without writing code."
category: automation
website: https://n8n.io
portField: HTTP_PORT
versions:
  - name: "2.36.0"
    images:
      - n8nio/n8n:2.36.0
    values:
      IMAGE: "n8nio/n8n:2.36.0"
  - name: "2.35.3"
    images:
      - n8nio/n8n:2.35.3
    values:
      IMAGE: "n8nio/n8n:2.35.3"
  - name: "1.123.72"
    images:
      - n8nio/n8n:1.123.72
    values:
      IMAGE: "n8nio/n8n:1.123.72"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "5678"
    required: true
  - key: HOST_NAME
    label: {vi: Tên miền, en: Host name}
    help:
      vi: "Địa chỉ n8n dùng để dựng liên kết webhook gửi cho dịch vụ ngoài."
      en: "The address n8n uses to build the webhook links it hands to outside services."
    type: text
    default: "localhost"
    required: true
  - key: TIMEZONE
    label: {vi: Múi giờ, en: Timezone}
    type: select
    default: "Asia/Ho_Chi_Minh"
    options:
      - value: "Asia/Ho_Chi_Minh"
        label: {vi: Việt Nam, en: Vietnam}
      - value: "UTC"
        label: {vi: UTC, en: UTC}
      - value: "Asia/Singapore"
        label: {vi: Singapore, en: Singapore}
      - value: "Europe/London"
        label: {vi: London, en: London}
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        N8N_HOST: "${HOST_NAME}"
        GENERIC_TIMEZONE: "${TIMEZONE}"
        TZ: "${TIMEZONE}"
        N8N_PORT: "5678"
      ports:
        - "${HTTP_PORT}:5678"
      volumes:
        - data:/home/node/.n8n

  volumes:
    data:
