key: lychee
name:
  vi: Lychee
  en: Lychee
description:
  vi: "Thư viện ảnh gọn nhẹ để đăng và chia sẻ album, tự đọc thông tin máy ảnh trong tệp."
  en: "A light photo gallery for publishing and sharing albums, reading camera data from the files."
category: media
website: https://lycheeorg.github.io
portField: HTTP_PORT
versions:
  - name: "7.7.3"
    images:
      - lycheeorg/lychee:v7.7.3
    values:
      IMAGE: "lycheeorg/lychee:v7.7.3"
  - name: "7.6.4"
    images:
      - lycheeorg/lychee:v7.6.4
    values:
      IMAGE: "lycheeorg/lychee:v7.6.4"
  - name: "6.10.4"
    images:
      - lycheeorg/lychee:v6.10.4
    values:
      IMAGE: "lycheeorg/lychee:v6.10.4"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8486"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        PUID: "1000"
        PGID: "1000"
        TIMEZONE: "Asia/Ho_Chi_Minh"
        DB_CONNECTION: "sqlite"
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - config:/conf
        - uploads:/uploads
        - sym:/sym

  volumes:
    config:
    uploads:
    sym:
