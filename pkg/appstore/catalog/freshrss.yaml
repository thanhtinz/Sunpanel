key: freshrss
name:
  vi: FreshRSS
  en: FreshRSS
description:
  vi: "Đọc tin RSS tự quản, đồng bộ với ứng dụng đọc trên điện thoại."
  en: "A self-hosted RSS reader that syncs with mobile reader apps."
category: productivity
website: https://freshrss.org
portField: HTTP_PORT
versions:
  - name: "1.29.1"
    images:
      - freshrss/freshrss:1.29.1
    values:
      IMAGE: "freshrss/freshrss:1.29.1"
  - name: "1.28.1"
    images:
      - freshrss/freshrss:1.28.1
    values:
      IMAGE: "freshrss/freshrss:1.28.1"
  - name: "1.27.1"
    images:
      - freshrss/freshrss:1.27.1
    values:
      IMAGE: "freshrss/freshrss:1.27.1"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "3060"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        TZ: "Asia/Ho_Chi_Minh"
        CRON_MIN: "*/20"
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/www/FreshRSS/data

  volumes:
    data:
