key: onlyoffice
name:
  vi: ONLYOFFICE Docs
  en: ONLYOFFICE Docs
description:
  vi: "Bộ soạn thảo Word, Excel và PowerPoint chạy trên máy chủ, nhiều người sửa cùng lúc."
  en: "A server-side Word, Excel and PowerPoint editor with real-time co-editing."
category: productivity
website: https://onlyoffice.com
portField: HTTP_PORT
versions:
  - name: "9.4.0.1"
    images:
      - onlyoffice/documentserver:9.4.0.1
    values:
      IMAGE: "onlyoffice/documentserver:9.4.0.1"
  - name: "8.3.3.1"
    images:
      - onlyoffice/documentserver:8.3.3.1
    values:
      IMAGE: "onlyoffice/documentserver:8.3.3.1"
  - name: "7.5.1.1"
    images:
      - onlyoffice/documentserver:7.5.1.1
    values:
      IMAGE: "onlyoffice/documentserver:7.5.1.1"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    help:
      vi: "ONLYOFFICE cần khoảng 4 GB RAM và vài phút cho lần khởi động đầu."
      en: "ONLYOFFICE wants around 4 GB of RAM and a few minutes on first boot."
    type: port
    default: "8608"
    required: true
  - key: JWT_SECRET
    label: {vi: Khóa ký yêu cầu, en: Request signing secret}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        JWT_ENABLED: "true"
        JWT_SECRET: "${JWT_SECRET}"
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/www/onlyoffice/Data
        - logs:/var/log/onlyoffice

  volumes:
    data:
    logs:
