key: flaresolverr
name:
  vi: FlareSolverr
  en: FlareSolverr
description:
  vi: "Vượt trang chặn tự động giúp các công cụ tìm nguồn, chạy như một proxy nhỏ."
  en: "Solves anti-bot challenges for indexer tools, running as a small proxy."
category: tool
website: https://github.com/FlareSolverr/FlareSolverr
portField: HTTP_PORT
versions:
  - name: "3.5.0"
    images:
      - ghcr.io/flaresolverr/flaresolverr:v3.5.0
    values:
      IMAGE: "ghcr.io/flaresolverr/flaresolverr:v3.5.0"
  - name: "3.4.6"
    images:
      - ghcr.io/flaresolverr/flaresolverr:v3.4.6
    values:
      IMAGE: "ghcr.io/flaresolverr/flaresolverr:v3.4.6"
  - name: "3.3.25"
    images:
      - ghcr.io/flaresolverr/flaresolverr:v3.3.25
    values:
      IMAGE: "ghcr.io/flaresolverr/flaresolverr:v3.3.25"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng, en: Port}
    type: port
    default: "8191"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        LOG_LEVEL: "info"
        TZ: "Asia/Ho_Chi_Minh"
      ports:
        - "${HTTP_PORT}:8191"
