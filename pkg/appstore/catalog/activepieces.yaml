key: activepieces
name:
  vi: Activepieces
  en: Activepieces
description:
  vi: "Nối các dịch vụ lại thành quy trình tự động, giống n8n nhưng giao diện gọn hơn."
  en: "Wires services into automated flows — like n8n with a tighter interface."
category: automation
website: https://activepieces.com
portField: HTTP_PORT
versions:
  - name: "0.88.1"
    images:
      - activepieces/activepieces:0.88.1
      - postgres:16-alpine
      - redis:7-alpine
    values:
      IMAGE: "activepieces/activepieces:0.88.1"
      DB_IMAGE: "postgres:16-alpine"
      REDIS_IMAGE: "redis:7-alpine"
  - name: "0.87.0"
    images:
      - activepieces/activepieces:0.87.0
      - postgres:16-alpine
      - redis:7-alpine
    values:
      IMAGE: "activepieces/activepieces:0.87.0"
      DB_IMAGE: "postgres:16-alpine"
      REDIS_IMAGE: "redis:7-alpine"
  - name: "0.86.3"
    images:
      - activepieces/activepieces:0.86.3
      - postgres:16-alpine
      - redis:7-alpine
    values:
      IMAGE: "activepieces/activepieces:0.86.3"
      DB_IMAGE: "postgres:16-alpine"
      REDIS_IMAGE: "redis:7-alpine"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8117"
    required: true
  - key: ENCRYPTION_KEY
    label: {vi: Khóa mã hóa, en: Encryption key}
    type: password
    generate: true
  - key: JWT_SECRET
    label: {vi: Khóa ký phiên, en: Session secret}
    type: password
    generate: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
        - redis
      environment:
        AP_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
        AP_JWT_SECRET: ${JWT_SECRET}
        AP_POSTGRES_DATABASE: activepieces
        AP_POSTGRES_HOST: db
        AP_POSTGRES_PORT: "5432"
        AP_POSTGRES_USERNAME: activepieces
        AP_POSTGRES_PASSWORD: ${DB_PASSWORD}
        AP_REDIS_HOST: redis
        AP_REDIS_PORT: "6379"
        AP_FRONTEND_URL: http://localhost
      ports:
        - "${HTTP_PORT}:80"

    redis:
      image: ${REDIS_IMAGE}
      container_name: ${CONTAINER_NAME}-redis
      restart: unless-stopped

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: activepieces
        POSTGRES_USER: activepieces
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db:/var/lib/postgresql/data

  volumes:
    db:
