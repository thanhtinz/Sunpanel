key: memos
name:
  vi: Memos
  en: Memos
description:
  vi: "Sổ ghi chú nhanh dạng dòng thời gian, gõ là lưu, tìm lại bằng thẻ."
  en: "A quick note timeline: type, save, and find things again by tag."
category: productivity
website: https://usememos.com
portField: HTTP_PORT
versions:
  - name: "0.30"
    images:
      - neosmemo/memos:0.30
    values:
      IMAGE: "neosmemo/memos:0.30"
  - name: "0.29.1"
    images:
      - neosmemo/memos:0.29.1
    values:
      IMAGE: "neosmemo/memos:0.29.1"
  - name: "0.28"
    images:
      - neosmemo/memos:0.28
    values:
      IMAGE: "neosmemo/memos:0.28"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "5230"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:5230"
      volumes:
        - data:/var/opt/memos

  volumes:
    data:
