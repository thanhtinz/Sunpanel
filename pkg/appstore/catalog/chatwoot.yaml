key: chatwoot
name:
  vi: Chatwoot
  en: Chatwoot
description:
  vi: "Hộp thoại chăm sóc khách hàng gom mọi kênh: web, email, Facebook và WhatsApp."
  en: "A customer support inbox that gathers every channel: web, email, Facebook and WhatsApp."
category: productivity
website: https://chatwoot.com
portField: HTTP_PORT
versions:
  - name: "4.16.2-ce"
    images:
      - chatwoot/chatwoot:v4.16.2-ce
      - postgres:16-alpine
      - redis:7-alpine
    values:
      IMAGE: "chatwoot/chatwoot:v4.16.2-ce"
      DB_IMAGE: "postgres:16-alpine"
      REDIS_IMAGE: "redis:7-alpine"
  - name: "3.16.0-ce"
    images:
      - chatwoot/chatwoot:v3.16.0-ce
      - postgres:16-alpine
      - redis:7-alpine
    values:
      IMAGE: "chatwoot/chatwoot:v3.16.0-ce"
      DB_IMAGE: "postgres:16-alpine"
      REDIS_IMAGE: "redis:7-alpine"
  - name: "2.18.0"
    images:
      - chatwoot/chatwoot:v2.18.0
      - postgres:16-alpine
      - redis:7-alpine
    values:
      IMAGE: "chatwoot/chatwoot:v2.18.0"
      DB_IMAGE: "postgres:16-alpine"
      REDIS_IMAGE: "redis:7-alpine"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "3400"
    required: true
  - key: FRONTEND_URL
    label: {vi: Địa chỉ trang, en: Site URL}
    type: text
    default: "http://localhost:3400"
    required: true
  - key: SECRET_KEY_BASE
    label: {vi: Khóa bí mật, en: Secret key}
    type: password
    generate: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      command: bundle exec rails s -p 3000 -b 0.0.0.0
      depends_on:
        - db
        - redis
      environment:
        RAILS_ENV: production
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
        FRONTEND_URL: ${FRONTEND_URL}
        POSTGRES_HOST: db
        POSTGRES_DATABASE: chatwoot
        POSTGRES_USERNAME: chatwoot
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        REDIS_URL: redis://redis:6379
      ports:
        - "${HTTP_PORT}:3000"
      volumes:
        - storage:/app/storage

    redis:
      image: ${REDIS_IMAGE}
      container_name: ${CONTAINER_NAME}-redis
      restart: unless-stopped

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: chatwoot
        POSTGRES_USER: chatwoot
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db:/var/lib/postgresql/data

  volumes:
    storage:
    db:
