key: dolibarr
name:
  vi: Dolibarr
  en: Dolibarr
description:
  vi: "Quản trị doanh nghiệp nhỏ: khách hàng, báo giá, hóa đơn, kho và dự án."
  en: "Small-business management: customers, quotes, invoices, stock and projects."
category: productivity
website: https://dolibarr.org
portField: HTTP_PORT
versions:
  - name: "23.0.3"
    images:
      - dolibarr/dolibarr:23.0.3
      - mariadb:11
    values:
      IMAGE: "dolibarr/dolibarr:23.0.3"
      DB_IMAGE: "mariadb:11"
  - name: "22.0.5"
    images:
      - dolibarr/dolibarr:22.0.5
      - mariadb:11
    values:
      IMAGE: "dolibarr/dolibarr:22.0.5"
      DB_IMAGE: "mariadb:11"
  - name: "21.0.4"
    images:
      - dolibarr/dolibarr:21.0.4
      - mariadb:11
    values:
      IMAGE: "dolibarr/dolibarr:21.0.4"
      DB_IMAGE: "mariadb:11"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8600"
    required: true
  - key: ADMIN_USER
    label: {vi: Tài khoản quản trị, en: Admin user}
    type: text
    default: "admin"
    required: true
  - key: ADMIN_PASSWORD
    label: {vi: Mật khẩu quản trị, en: Admin password}
    type: password
    generate: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        DOLI_DB_HOST: db
        DOLI_DB_NAME: dolibarr
        DOLI_DB_USER: dolibarr
        DOLI_DB_PASSWORD: ${DB_PASSWORD}
        DOLI_ADMIN_LOGIN: ${ADMIN_USER}
        DOLI_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - documents:/var/www/documents
        - custom:/var/www/html/custom

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: dolibarr
        MARIADB_USER: dolibarr
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "1"
      volumes:
        - db:/var/lib/mysql

  volumes:
    documents:
    custom:
    db:
