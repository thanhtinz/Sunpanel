key: joomla
name:
  vi: Joomla
  en: Joomla
description:
  vi: "Nền tảng quản trị nội dung lâu đời, mạnh ở phân quyền và website nhiều ngôn ngữ."
  en: "A long-established CMS, strong on permissions and multilingual sites."
category: website
website: https://joomla.org
portField: HTTP_PORT
versions:
  - name: "6.1.2"
    images:
      - joomla:6.1.2-apache
      - mysql:8
    values:
      IMAGE: "joomla:6.1.2-apache"
      DB_IMAGE: "mysql:8"
  - name: "5.4.7"
    images:
      - joomla:5.4.7-apache
      - mysql:8
    values:
      IMAGE: "joomla:5.4.7-apache"
      DB_IMAGE: "mysql:8"
  - name: "4.4.14"
    images:
      - joomla:4.4.14-apache
      - mysql:8
    values:
      IMAGE: "joomla:4.4.14-apache"
      DB_IMAGE: "mysql:8"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8620"
    required: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        JOOMLA_DB_HOST: db
        JOOMLA_DB_NAME: joomla
        JOOMLA_DB_USER: joomla
        JOOMLA_DB_PASSWORD: ${DB_PASSWORD}
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/www/html

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        MYSQL_DATABASE: joomla
        MYSQL_USER: joomla
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_RANDOM_ROOT_PASSWORD: "1"
      volumes:
        - db:/var/lib/mysql

  volumes:
    data:
    db:
