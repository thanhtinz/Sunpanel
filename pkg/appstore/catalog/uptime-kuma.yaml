key: uptime-kuma
name:
  vi: Uptime Kuma
  en: Uptime Kuma
description:
  vi: "Giám sát website và dịch vụ, báo động qua Telegram, email và hàng chục kênh khác."
  en: "Monitors websites and services and alerts through Telegram, email and dozens more channels."
category: monitoring
website: https://uptime.kuma.pet
portField: HTTP_PORT
versions:
  - name: "2.5.0"
    images:
      - louislam/uptime-kuma:2.5.0
    values:
      IMAGE: "louislam/uptime-kuma:2.5.0"
  - name: "2.4.0"
    images:
      - louislam/uptime-kuma:2.4.0
    values:
      IMAGE: "louislam/uptime-kuma:2.4.0"
  - name: "1.23.17"
    images:
      - louislam/uptime-kuma:1.23.17
    values:
      IMAGE: "louislam/uptime-kuma:1.23.17"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "3001"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:3001"
      volumes:
        - data:/app/data

  volumes:
    data:
