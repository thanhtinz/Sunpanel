key: yacht
name:
  vi: Yacht
  en: Yacht
description:
  vi: "Giao diện quản lý container nhẹ, tập trung vào cài ứng dụng bằng khuôn mẫu."
  en: "A light container management UI focused on installing apps from templates."
category: tool
website: https://yacht.sh
portField: HTTP_PORT
versions:
  - name: "latest"
    note:
      vi: "Dự án chỉ phát hành thẻ latest, nên mỗi lần cài lại sẽ lấy bản mới nhất lúc đó."
      en: "The project only publishes a latest tag, so each install pulls whatever is newest then."
    images:
      - selfhostedpro/yacht:latest
    values:
      IMAGE: "selfhostedpro/yacht:latest"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8141"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8000"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - config:/config

  volumes:
    config:
