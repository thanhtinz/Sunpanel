key: friendica
name:
  vi: Friendica
  en: Friendica
description:
  vi: "Mạng xã hội liên kết nối được với cả Mastodon, Diaspora và nhiều mạng khác."
  en: "A federated social network that connects to Mastodon, Diaspora and more."
category: website
website: https://friendi.ca
portField: HTTP_PORT
versions:
  - name: "2026.05"
    images:
      - friendica:2026.05-apache
      - mariadb:11
    values:
      IMAGE: "friendica:2026.05-apache"
      DB_IMAGE: "mariadb:11"
  - name: "2024.12"
    images:
      - friendica:2024.12-apache
      - mariadb:11
    values:
      IMAGE: "friendica:2024.12-apache"
      DB_IMAGE: "mariadb:11"
  - name: "2023.12"
    images:
      - friendica:2023.12-apache
      - mariadb:11
    values:
      IMAGE: "friendica:2023.12-apache"
      DB_IMAGE: "mariadb:11"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8623"
    required: true
  - key: SITE_URL
    label: {vi: Địa chỉ trang, en: Site URL}
    type: text
    default: "http://localhost:8623"
    required: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        MYSQL_HOST: db
        MYSQL_DATABASE: friendica
        MYSQL_USER: friendica
        MYSQL_PASSWORD: ${DB_PASSWORD}
        FRIENDICA_URL: ${SITE_URL}
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/www/html

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: friendica
        MARIADB_USER: friendica
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "1"
      volumes:
        - db:/var/lib/mysql

  volumes:
    data:
    db:
