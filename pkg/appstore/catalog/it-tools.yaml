key: it-tools
name:
  vi: IT Tools
  en: IT Tools
description:
  vi: "Hộp công cụ cho người làm kỹ thuật: mã hóa, JSON, mã QR, chuyển đổi, sinh chuỗi."
  en: "A toolbox for engineers: encoding, JSON, QR codes, converters and generators."
category: tool
website: https://it-tools.tech
portField: HTTP_PORT
versions:
  - name: "2024.10.22"
    images:
      - corentinth/it-tools:2024.10.22
    values:
      IMAGE: "corentinth/it-tools:2024.10.22"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8085"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
