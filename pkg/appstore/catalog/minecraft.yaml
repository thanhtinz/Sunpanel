key: minecraft
name:
  vi: Minecraft Server
  en: Minecraft Server
description:
  vi: "Máy chủ Minecraft cho bạn bè cùng chơi, chọn được phiên bản và loại máy chủ."
  en: "A Minecraft server for you and friends, with a choice of version and server type."
category: tool
website: https://github.com/itzg/docker-minecraft-server
portField: GAME_PORT
versions:
  - name: "java21"
    images:
      - itzg/minecraft-server:java21
    values:
      IMAGE: "itzg/minecraft-server:java21"
  - name: "java17"
    images:
      - itzg/minecraft-server:java17
    values:
      IMAGE: "itzg/minecraft-server:java17"
  - name: "java8"
    images:
      - itzg/minecraft-server:java8
    values:
      IMAGE: "itzg/minecraft-server:java8"
fields:
  - key: GAME_PORT
    label: {vi: Cổng trò chơi, en: Game port}
    type: port
    default: "25565"
    required: true
  - key: SERVER_TYPE
    label: {vi: Loại máy chủ, en: Server type}
    type: select
    default: "PAPER"
    options:
      - value: "VANILLA"
        label: {vi: Gốc, en: Vanilla}
      - value: "PAPER"
        label: {vi: Paper (nhanh, có plugin), en: Paper (fast, plugins)}
      - value: "FABRIC"
        label: {vi: Fabric (mod), en: Fabric (mods)}
      - value: "FORGE"
        label: {vi: Forge (mod), en: Forge (mods)}
  - key: MEMORY
    label: {vi: Bộ nhớ cấp cho máy chủ, en: Server memory}
    type: text
    default: "2G"
    required: true
  - key: GAME_VERSION
    label: {vi: Phiên bản trò chơi, en: Game version}
    type: text
    default: "LATEST"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        EULA: "TRUE"
        TYPE: "${SERVER_TYPE}"
        MEMORY: "${MEMORY}"
        VERSION: "${GAME_VERSION}"
        TZ: "Asia/Ho_Chi_Minh"
      ports:
        - "${GAME_PORT}:25565"
      volumes:
        - data:/data

  volumes:
    data:
