key: nextcloud
name:
  vi: Nextcloud
  en: Nextcloud
description:
  vi: "Ổ đĩa đám mây tự quản: đồng bộ tệp, chia sẻ liên kết, lịch và danh bạ."
  en: "Self-hosted cloud storage with file sync, share links, calendar and contacts."
category: storage
version: "1"
website: https://nextcloud.com
images:
  - nextcloud:29-apache
  - postgres:16-alpine
portField: HTTP_PORT
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8080"
    required: true
  - key: ADMIN_USER
    label: {vi: Tài khoản quản trị, en: Admin user}
    type: text
    default: "admin"
    required: true
  - key: ADMIN_PASSWORD
    label: {vi: Mật khẩu quản trị, en: Admin password}
    type: password
    generate: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: nextcloud:29-apache
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        POSTGRES_HOST: db
        POSTGRES_DB: nextcloud
        POSTGRES_USER: nextcloud
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
        NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/www/html

    db:
      image: postgres:16-alpine
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: nextcloud
        POSTGRES_USER: nextcloud
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db:/var/lib/postgresql/data

  volumes:
    data:
    db:
