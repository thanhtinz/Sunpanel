key: nextcloud
name:
  vi: Nextcloud
  en: Nextcloud
description:
  vi: "Ổ đĩa đám mây tự quản: đồng bộ tệp, chia sẻ liên kết, lịch và danh bạ."
  en: "Self-hosted cloud storage with file sync, share links, calendar and contacts."
category: storage
website: https://nextcloud.com
portField: HTTP_PORT
versions:
  - name: "34.0.3"
    images:
      - nextcloud:34.0.3-apache
      - postgres:16-alpine
    values:
      IMAGE: "nextcloud:34.0.3-apache"
      DB_IMAGE: "postgres:16-alpine"
  - name: "33.0.8"
    images:
      - nextcloud:33.0.8-apache
      - postgres:16-alpine
    values:
      IMAGE: "nextcloud:33.0.8-apache"
      DB_IMAGE: "postgres:16-alpine"
  - name: "32.0.14"
    images:
      - nextcloud:32.0.14-apache
      - postgres:16-alpine
    values:
      IMAGE: "nextcloud:32.0.14-apache"
      DB_IMAGE: "postgres:16-alpine"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8081"
    required: true
  - key: ADMIN_USER
    label: {vi: Tài khoản quản trị, en: Admin user}
    type: text
    default: "admin"
    required: true
  - key: ADMIN_PASSWORD
    label: {vi: Mật khẩu quản trị, en: Admin password}
    type: password
    generate: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        POSTGRES_HOST: db
        POSTGRES_DB: nextcloud
        POSTGRES_USER: nextcloud
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
        NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/www/html

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: nextcloud
        POSTGRES_USER: nextcloud
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db:/var/lib/postgresql/data

  volumes:
    data:
    db:
