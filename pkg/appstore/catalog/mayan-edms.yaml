key: mayan-edms
name:
  vi: Mayan EDMS
  en: Mayan EDMS
description:
  vi: "Quản lý tài liệu cho tổ chức: phân loại tự động, nhận dạng chữ và quy trình duyệt."
  en: "Organisational document management: automatic classification, OCR and approval workflows."
category: productivity
website: https://mayan-edms.com
portField: HTTP_PORT
versions:
  - name: "4.12"
    images:
      - mayanedms/mayanedms:v4.12
      - postgres:16-alpine
      - redis:7-alpine
    values:
      IMAGE: "mayanedms/mayanedms:v4.12"
      DB_IMAGE: "postgres:16-alpine"
      REDIS_IMAGE: "redis:7-alpine"
  - name: "4.11.5"
    images:
      - mayanedms/mayanedms:v4.11.5
      - postgres:16-alpine
      - redis:7-alpine
    values:
      IMAGE: "mayanedms/mayanedms:v4.11.5"
      DB_IMAGE: "postgres:16-alpine"
      REDIS_IMAGE: "redis:7-alpine"
  - name: "4.10.6"
    images:
      - mayanedms/mayanedms:v4.10.6
      - postgres:16-alpine
      - redis:7-alpine
    values:
      IMAGE: "mayanedms/mayanedms:v4.10.6"
      DB_IMAGE: "postgres:16-alpine"
      REDIS_IMAGE: "redis:7-alpine"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8606"
    required: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
        - redis
      environment:
        MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'mayan','USER':'mayan','PASSWORD':'${DB_PASSWORD}','HOST':'db','PORT':5432}}"
        MAYAN_CELERY_BROKER_URL: redis://redis:6379/0
        MAYAN_CELERY_RESULT_BACKEND: redis://redis:6379/1
      ports:
        - "${HTTP_PORT}:8000"
      volumes:
        - data:/var/lib/mayan

    redis:
      image: ${REDIS_IMAGE}
      container_name: ${CONTAINER_NAME}-redis
      restart: unless-stopped

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: mayan
        POSTGRES_USER: mayan
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db:/var/lib/postgresql/data

  volumes:
    data:
    db:
