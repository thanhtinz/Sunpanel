key: metube
name:
  vi: MeTube
  en: MeTube
description:
  vi: "Tải video từ YouTube và hàng trăm trang khác bằng một ô dán liên kết."
  en: "Downloads video from YouTube and hundreds of other sites by pasting a link."
category: media
website: https://github.com/alexta69/metube
portField: HTTP_PORT
versions:
  - name: "2024-10-16"
    images:
      - ghcr.io/alexta69/metube:2024-10-16
    values:
      IMAGE: "ghcr.io/alexta69/metube:2024-10-16"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8089"
    required: true
  - key: DOWNLOAD_DIR
    label: {vi: Thư mục tải về, en: Download folder}
    type: text
    default: "/srv/downloads"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8081"
      volumes:
        - ${DOWNLOAD_DIR}:/downloads
