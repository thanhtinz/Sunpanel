key: seafile
name:
  vi: Seafile
  en: Seafile
description:
  vi: "Đồng bộ tệp theo khối, nhanh với thư mục nhiều tệp nhỏ như mã nguồn."
  en: "Block-level file sync that stays fast on folders full of small files, like source code."
category: storage
website: https://seafile.com
portField: HTTP_PORT
versions:
  - name: "13.0.25"
    images:
      - seafileltd/seafile-mc:13.0.25
      - mariadb:11
      - memcached:1.6-alpine
    values:
      IMAGE: "seafileltd/seafile-mc:13.0.25"
      DB_IMAGE: "mariadb:11"
      CACHE_IMAGE: "memcached:1.6-alpine"
  - name: "12.0.14"
    images:
      - seafileltd/seafile-mc:12.0.14
      - mariadb:11
      - memcached:1.6-alpine
    values:
      IMAGE: "seafileltd/seafile-mc:12.0.14"
      DB_IMAGE: "mariadb:11"
      CACHE_IMAGE: "memcached:1.6-alpine"
  - name: "11.0.13"
    images:
      - seafileltd/seafile-mc:11.0.13
      - mariadb:11
      - memcached:1.6-alpine
    values:
      IMAGE: "seafileltd/seafile-mc:11.0.13"
      DB_IMAGE: "mariadb:11"
      CACHE_IMAGE: "memcached:1.6-alpine"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8090"
    required: true
  - key: ADMIN_EMAIL
    label: {vi: Email quản trị, en: Admin email}
    type: text
    default: "admin@example.com"
    required: true
  - key: ADMIN_PASSWORD
    label: {vi: Mật khẩu quản trị, en: Admin password}
    type: password
    generate: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
        - memcached
      environment:
        DB_HOST: db
        DB_ROOT_PASSWD: ${DB_PASSWORD}
        SEAFILE_ADMIN_EMAIL: ${ADMIN_EMAIL}
        SEAFILE_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
        SEAFILE_SERVER_LETSENCRYPT: "false"
        TIME_ZONE: Asia/Ho_Chi_Minh
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/shared

    memcached:
      image: ${CACHE_IMAGE}
      container_name: ${CONTAINER_NAME}-cache
      restart: unless-stopped
      entrypoint: memcached -m 256

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
        MARIADB_AUTO_UPGRADE: "1"
      volumes:
        - db:/var/lib/mysql

  volumes:
    data:
    db:
