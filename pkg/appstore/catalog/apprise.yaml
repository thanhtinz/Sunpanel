key: apprise
name:
  vi: Apprise
  en: Apprise
description:
  vi: "Một API để gửi thông báo tới hơn tám mươi dịch vụ: Telegram, Discord, email, SMS."
  en: "One API that pushes notifications to over eighty services: Telegram, Discord, email, SMS."
category: monitoring
website: https://github.com/caronc/apprise-api
portField: HTTP_PORT
versions:
  - name: "1.5.1"
    images:
      - caronc/apprise:v1.5.1
    values:
      IMAGE: "caronc/apprise:v1.5.1"
  - name: "1.4.1"
    images:
      - caronc/apprise:v1.4.1
    values:
      IMAGE: "caronc/apprise:v1.4.1"
  - name: "1.3.3"
    images:
      - caronc/apprise:v1.3.3
    values:
      IMAGE: "caronc/apprise:v1.3.3"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng API, en: API port}
    type: port
    default: "8614"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        PUID: "1000"
        PGID: "1000"
      ports:
        - "${HTTP_PORT}:8000"
      volumes:
        - config:/config

  volumes:
    config:
