key: jellyfin
name:
  vi: Jellyfin
  en: Jellyfin
description:
  vi: "Máy chủ phim và nhạc cá nhân, phát tới trình duyệt, TV và điện thoại."
  en: "A personal movie and music server that streams to browsers, TVs and phones."
category: media
website: https://jellyfin.org
portField: HTTP_PORT
versions:
  - name: "10.11.11"
    images:
      - jellyfin/jellyfin:10.11.11
    values:
      IMAGE: "jellyfin/jellyfin:10.11.11"
  - name: "10.10.7"
    images:
      - jellyfin/jellyfin:10.10.7
    values:
      IMAGE: "jellyfin/jellyfin:10.10.7"
  - name: "10.9.11"
    images:
      - jellyfin/jellyfin:10.9.11
    values:
      IMAGE: "jellyfin/jellyfin:10.9.11"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8096"
    required: true
  - key: MEDIA_DIR
    label: {vi: Thư mục phim nhạc, en: Media folder}
    help:
      vi: "Thư mục sẵn có trên máy chủ, được gắn vào ứng dụng ở chế độ chỉ đọc."
      en: "An existing folder on the host, mounted into the app read-only."
    type: text
    default: "/srv/media"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8096"
      volumes:
        - config:/config
        - cache:/cache
        - ${MEDIA_DIR}:/media:ro

  volumes:
    config:
    cache:
