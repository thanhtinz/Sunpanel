key: tvheadend
name:
  vi: Tvheadend
  en: Tvheadend
description:
  vi: "Máy chủ truyền hình: nhận tín hiệu từ đầu thu, ghi hình theo lịch và phát cho thiết bị khác."
  en: "A TV streaming server: takes tuner input, records on a schedule and streams to other devices."
category: media
website: https://tvheadend.org
portField: HTTP_PORT
versions:
  - name: "latest"
    note:
      vi: "Dự án chỉ phát hành thẻ latest, nên mỗi lần cài lại sẽ lấy bản mới nhất lúc đó."
      en: "The project only publishes a latest tag, so each install pulls whatever is newest then."
    images:
      - linuxserver/tvheadend:latest
    values:
      IMAGE: "linuxserver/tvheadend:latest"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "9981"
    required: true
  - key: RECORDING_DIR
    label: {vi: Thư mục ghi hình, en: Recording folder}
    type: text
    default: "/srv/recordings"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Asia/Ho_Chi_Minh"
      ports:
        - "${HTTP_PORT}:9981"
      volumes:
        - config:/config
        - ${RECORDING_DIR}:/recordings

  volumes:
    config:
