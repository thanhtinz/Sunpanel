key: drone
name:
  vi: Drone CI
  en: Drone CI
description:
  vi: "Máy chạy CI/CD gọn nhẹ, mỗi bước là một container, cấu hình bằng một tệp YAML."
  en: "A lightweight CI/CD server: each step is a container, configured by one YAML file."
category: development
website: https://drone.io
portField: HTTP_PORT
versions:
  - name: "2.28.2"
    images:
      - drone/drone:2.28.2
    values:
      IMAGE: "drone/drone:2.28.2"
  - name: "2.27.2"
    images:
      - drone/drone:2.27.2
    values:
      IMAGE: "drone/drone:2.27.2"
  - name: "2.26.0"
    images:
      - drone/drone:2.26.0
    values:
      IMAGE: "drone/drone:2.26.0"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8095"
    required: true
  - key: SERVER_HOST
    label: {vi: Tên miền, en: Server host}
    type: text
    default: "localhost:8095"
    required: true
  - key: GITEA_SERVER
    label: {vi: Địa chỉ Gitea, en: Gitea server}
    type: text
    default: "http://localhost:3000"
    required: true
  - key: CLIENT_ID
    label: {vi: Client ID của ứng dụng OAuth, en: OAuth client ID}
    type: text
    required: true
  - key: CLIENT_SECRET
    label: {vi: Client secret, en: Client secret}
    type: password
    generate: true
  - key: RPC_SECRET
    label: {vi: Khóa cho máy chạy lệnh, en: Runner shared secret}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        DRONE_GITEA_SERVER: "${GITEA_SERVER}"
        DRONE_GITEA_CLIENT_ID: "${CLIENT_ID}"
        DRONE_GITEA_CLIENT_SECRET: "${CLIENT_SECRET}"
        DRONE_RPC_SECRET: "${RPC_SECRET}"
        DRONE_SERVER_HOST: "${SERVER_HOST}"
        DRONE_SERVER_PROTO: "http"
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/data

  volumes:
    data:
