key: joplin
name:
  vi: Joplin Server
  en: Joplin Server
description:
  vi: "Máy chủ đồng bộ cho ứng dụng ghi chú Joplin, giữ ghi chú mã hóa đầu cuối."
  en: "The sync server for the Joplin note app, keeping notes end-to-end encrypted."
category: productivity
website: https://joplinapp.org
portField: HTTP_PORT
versions:
  - name: "3.7.1"
    images:
      - joplin/server:3.7.1
      - postgres:16-alpine
    values:
      IMAGE: "joplin/server:3.7.1"
      DB_IMAGE: "postgres:16-alpine"
  - name: "3.6.1"
    images:
      - joplin/server:3.6.1
      - postgres:16-alpine
    values:
      IMAGE: "joplin/server:3.6.1"
      DB_IMAGE: "postgres:16-alpine"
  - name: "2.5.1"
    images:
      - joplin/server:2.5.1
      - postgres:16-alpine
    values:
      IMAGE: "joplin/server:2.5.1"
      DB_IMAGE: "postgres:16-alpine"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "22300"
    required: true
  - key: APP_BASE_URL
    label: {vi: Địa chỉ trang, en: Site URL}
    type: text
    default: "http://localhost:22300"
    required: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        APP_BASE_URL: ${APP_BASE_URL}
        APP_PORT: "22300"
        DB_CLIENT: pg
        POSTGRES_HOST: db
        POSTGRES_PORT: "5432"
        POSTGRES_DATABASE: joplin
        POSTGRES_USER: joplin
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      ports:
        - "${HTTP_PORT}:22300"

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: joplin
        POSTGRES_USER: joplin
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db:/var/lib/postgresql/data

  volumes:
    db:
