key: dozzle
name:
  vi: Dozzle
  en: Dozzle
description:
  vi: "Xem nhật ký container theo thời gian thực trong trình duyệt, không lưu gì xuống đĩa."
  en: "Watch container logs live in the browser without writing anything to disk."
category: monitoring
website: https://dozzle.dev
portField: HTTP_PORT
versions:
  - name: "10.7.2"
    images:
      - amir20/dozzle:v10.7.2
    values:
      IMAGE: "amir20/dozzle:v10.7.2"
  - name: "9.0.3"
    images:
      - amir20/dozzle:v9.0.3
    values:
      IMAGE: "amir20/dozzle:v9.0.3"
  - name: "8.14.12"
    images:
      - amir20/dozzle:v8.14.12
    values:
      IMAGE: "amir20/dozzle:v8.14.12"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    help:
      vi: "Dozzle đọc được nhật ký mọi container, kể cả phần lộ mật khẩu. Đừng mở ra Internet."
      en: "Dozzle can read every container's logs, passwords included. Do not expose it publicly."
    type: port
    default: "9999"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
