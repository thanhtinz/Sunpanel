key: metabase
name:
  vi: Metabase
  en: Metabase
description:
  vi: "Hỏi đáp số liệu bằng giao diện kéo thả, không cần viết SQL, dựng bảng biểu chia sẻ được."
  en: "Ask questions of your data by pointing and clicking — no SQL needed — and share dashboards."
category: database
website: https://metabase.com
portField: HTTP_PORT
versions:
  - name: "0.63.13"
    images:
      - metabase/metabase:v0.63.13
      - postgres:16-alpine
    values:
      IMAGE: "metabase/metabase:v0.63.13"
      DB_IMAGE: "postgres:16-alpine"
  - name: "0.62.16"
    images:
      - metabase/metabase:v0.62.16
      - postgres:16-alpine
    values:
      IMAGE: "metabase/metabase:v0.62.16"
      DB_IMAGE: "postgres:16-alpine"
  - name: "0.61.18"
    images:
      - metabase/metabase:v0.61.18
      - postgres:16-alpine
    values:
      IMAGE: "metabase/metabase:v0.61.18"
      DB_IMAGE: "postgres:16-alpine"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "3003"
    required: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        MB_DB_TYPE: postgres
        MB_DB_DBNAME: metabase
        MB_DB_PORT: "5432"
        MB_DB_USER: metabase
        MB_DB_PASS: ${DB_PASSWORD}
        MB_DB_HOST: db
      ports:
        - "${HTTP_PORT}:3000"

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: metabase
        POSTGRES_USER: metabase
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db:/var/lib/postgresql/data

  volumes:
    db:
