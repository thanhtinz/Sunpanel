key: pyload
name:
  vi: pyLoad
  en: pyLoad
description:
  vi: "Trình tải tệp từ các trang chia sẻ, nhận cả danh sách liên kết và giải nén sau khi xong."
  en: "Downloads files from one-click hosters, taking link lists and unpacking when done."
category: media
website: https://pyload.net
portField: HTTP_PORT
versions:
  - name: "latest"
    note:
      vi: "Dự án chỉ phát hành thẻ latest, nên mỗi lần cài lại sẽ lấy bản mới nhất lúc đó."
      en: "The project only publishes a latest tag, so each install pulls whatever is newest then."
    images:
      - linuxserver/pyload-ng:latest
    values:
      IMAGE: "linuxserver/pyload-ng:latest"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8060"
    required: true
  - key: DOWNLOAD_DIR
    label: {vi: Thư mục tải về, en: Download folder}
    help:
      vi: "Thư mục sẵn có trên máy chủ, được gắn vào ứng dụng."
      en: "An existing folder on the host, mounted into the app."
    type: text
    default: "/srv/downloads"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Asia/Ho_Chi_Minh"
      ports:
        - "${HTTP_PORT}:8000"
      volumes:
        - config:/config
        - ${DOWNLOAD_DIR}:/downloads

  volumes:
    config:
