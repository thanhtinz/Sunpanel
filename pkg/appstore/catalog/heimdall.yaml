key: heimdall
name:
  vi: Heimdall
  en: Heimdall
description:
  vi: "Trang chủ dạng lưới biểu tượng cho mọi ứng dụng đang chạy trên máy chủ."
  en: "An icon-grid start page for every app running on your server."
category: tool
website: https://heimdall.site
portField: HTTP_PORT
versions:
  - name: "2.8.2"
    images:
      - linuxserver/heimdall:2.8.2
    values:
      IMAGE: "linuxserver/heimdall:2.8.2"
  - name: "2.7.6"
    images:
      - linuxserver/heimdall:2.7.6
    values:
      IMAGE: "linuxserver/heimdall:2.7.6"
  - name: "2.6.3"
    images:
      - linuxserver/heimdall:2.6.3
    values:
      IMAGE: "linuxserver/heimdall:2.6.3"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "3021"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Asia/Ho_Chi_Minh"
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - config:/config

  volumes:
    config:
