key: freescout
name:
  vi: FreeScout
  en: FreeScout
description:
  vi: "Hộp thư hỗ trợ dùng chung cho cả nhóm, thay Help Scout mà không tốn phí theo tháng."
  en: "A shared support inbox for the whole team — a Help Scout replacement with no monthly fee."
category: productivity
website: https://freescout.net
portField: HTTP_PORT
versions:
  - name: "1.17.999"
    images:
      - tiredofit/freescout:php8.2-1.17.999
      - mariadb:11
    values:
      IMAGE: "tiredofit/freescout:php8.2-1.17.999"
      DB_IMAGE: "mariadb:11"
  - name: "1.16.43"
    images:
      - tiredofit/freescout:php8.2-1.16.43
      - mariadb:11
    values:
      IMAGE: "tiredofit/freescout:php8.2-1.16.43"
      DB_IMAGE: "mariadb:11"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8605"
    required: true
  - key: SITE_URL
    label: {vi: Địa chỉ trang, en: Site URL}
    type: text
    default: "http://localhost:8605"
    required: true
  - key: ADMIN_EMAIL
    label: {vi: Email quản trị, en: Admin email}
    type: text
    default: "admin@example.com"
    required: true
  - key: ADMIN_PASSWORD
    label: {vi: Mật khẩu quản trị, en: Admin password}
    type: password
    generate: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        DB_HOST: db
        DB_NAME: freescout
        DB_USER: freescout
        DB_PASS: ${DB_PASSWORD}
        SITE_URL: ${SITE_URL}
        ADMIN_EMAIL: ${ADMIN_EMAIL}
        ADMIN_PASS: ${ADMIN_PASSWORD}
        TIMEZONE: Asia/Ho_Chi_Minh
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/data

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: freescout
        MARIADB_USER: freescout
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "1"
      volumes:
        - db:/var/lib/mysql

  volumes:
    data:
    db:
