key: kanboard
name:
  vi: Kanboard
  en: Kanboard
description:
  vi: "Bảng Kanban tối giản, nhanh và chạy tốt trên máy chủ nhỏ nhất."
  en: "A minimalist Kanban board that stays fast on the smallest of servers."
category: productivity
website: https://kanboard.org
portField: HTTP_PORT
versions:
  - name: "1.2.53"
    images:
      - kanboard/kanboard:v1.2.53
    values:
      IMAGE: "kanboard/kanboard:v1.2.53"
  - name: "1.1.1"
    images:
      - kanboard/kanboard:v1.1.1
    values:
      IMAGE: "kanboard/kanboard:v1.1.1"
  - name: "1.0.48"
    images:
      - kanboard/kanboard:v1.0.48
    values:
      IMAGE: "kanboard/kanboard:v1.0.48"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8624"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/www/app/data
        - plugins:/var/www/app/plugins

  volumes:
    data:
    plugins:
