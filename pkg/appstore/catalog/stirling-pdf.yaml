key: stirling-pdf
name:
  vi: Stirling PDF
  en: Stirling PDF
description:
  vi: "Bộ công cụ PDF chạy ngay trên máy chủ: gộp, tách, xoay, nén, ký, chuyển định dạng."
  en: "A PDF toolbox on your own server: merge, split, rotate, compress, sign and convert."
category: tool
website: https://stirlingpdf.com
portField: HTTP_PORT
versions:
  - name: "2.14.3"
    images:
      - stirlingtools/stirling-pdf:2.14.3
    values:
      IMAGE: "stirlingtools/stirling-pdf:2.14.3"
  - name: "1.6.0"
    images:
      - stirlingtools/stirling-pdf:1.6.0
    values:
      IMAGE: "stirlingtools/stirling-pdf:1.6.0"
  - name: "0.46.2"
    images:
      - stirlingtools/stirling-pdf:0.46.2
    values:
      IMAGE: "stirlingtools/stirling-pdf:0.46.2"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8084"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
      volumes:
        - data:/usr/share/tessdata

  volumes:
    data:
