key: transmission
name:
  vi: Transmission
  en: Transmission
description:
  vi: "Máy tải torrent gọn nhẹ, ăn ít RAM, hợp với máy chủ cấu hình thấp."
  en: "A lightweight torrent client that sips memory — good for small servers."
category: media
website: https://transmissionbt.com
portField: HTTP_PORT
versions:
  - name: "4.1.3"
    images:
      - linuxserver/transmission:4.1.3
    values:
      IMAGE: "linuxserver/transmission:4.1.3"
  - name: "4.0.6"
    images:
      - linuxserver/transmission:4.0.6
    values:
      IMAGE: "linuxserver/transmission:4.0.6"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "9091"
    required: true
  - key: TORRENT_PORT
    label: {vi: Cổng torrent, en: Torrent port}
    type: port
    default: "51413"
    required: true
  - key: DOWNLOAD_DIR
    label: {vi: Thư mục tải về, en: Download folder}
    type: text
    default: "/srv/downloads"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Asia/Ho_Chi_Minh"
      ports:
        - "${HTTP_PORT}:9091"
        - "${TORRENT_PORT}:51413/tcp"
        - "${TORRENT_PORT}:51413/udp"
      volumes:
        - config:/config
        - ${DOWNLOAD_DIR}:/downloads

  volumes:
    config:
