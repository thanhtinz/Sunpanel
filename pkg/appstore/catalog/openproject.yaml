key: openproject
name:
  vi: OpenProject
  en: OpenProject
description:
  vi: "Quản lý dự án đầy đủ: Gantt, sprint, tài liệu và theo dõi thời gian."
  en: "Full project management: Gantt charts, sprints, documents and time tracking."
category: productivity
website: https://openproject.org
portField: HTTP_PORT
versions:
  - name: "17.7.2"
    images:
      - openproject/openproject:17.7.2
    values:
      IMAGE: "openproject/openproject:17.7.2"
  - name: "16.6.10"
    images:
      - openproject/openproject:16.6.10
    values:
      IMAGE: "openproject/openproject:16.6.10"
  - name: "15.5.1"
    images:
      - openproject/openproject:15.5.1
    values:
      IMAGE: "openproject/openproject:15.5.1"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    help:
      vi: "OpenProject cần khoảng 4 GB RAM và vài phút cho lần khởi động đầu."
      en: "OpenProject wants around 4 GB of RAM and a few minutes on first boot."
    type: port
    default: "8132"
    required: true
  - key: SECRET_KEY_BASE
    label: {vi: Khóa bí mật, en: Secret key}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
        OPENPROJECT_HOST__NAME: "localhost"
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/openproject/assets

  volumes:
    data:
