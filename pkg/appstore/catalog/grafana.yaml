key: grafana
name:
  vi: Grafana
  en: Grafana
description:
  vi: "Bảng biểu đồ cho mọi nguồn số liệu: Prometheus, cơ sở dữ liệu, nhật ký."
  en: "Dashboards for any data source: Prometheus, databases and logs."
category: monitoring
website: https://grafana.com
portField: HTTP_PORT
versions:
  - name: "13.2"
    images:
      - grafana/grafana:13.2
    values:
      IMAGE: "grafana/grafana:13.2"
  - name: "12.4.9"
    images:
      - grafana/grafana:12.4.9
    values:
      IMAGE: "grafana/grafana:12.4.9"
  - name: "11.6.16"
    images:
      - grafana/grafana:11.6.16
    values:
      IMAGE: "grafana/grafana:11.6.16"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "3004"
    required: true
  - key: ADMIN_USER
    label: {vi: Tài khoản quản trị, en: Admin user}
    type: text
    default: "admin"
    required: true
  - key: ADMIN_PASSWORD
    label: {vi: Mật khẩu quản trị, en: Admin password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        GF_SECURITY_ADMIN_USER: "${ADMIN_USER}"
        GF_SECURITY_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ports:
        - "${HTTP_PORT}:3000"
      volumes:
        - data:/var/lib/grafana

  volumes:
    data:
