key: grafana
name:
  vi: Grafana
  en: Grafana
description:
  vi: "Bảng biểu đồ cho mọi nguồn số liệu: Prometheus, cơ sở dữ liệu, nhật ký."
  en: "Dashboards for any data source: Prometheus, databases and logs."
category: monitoring
version: "1"
website: https://grafana.com
images:
  - grafana/grafana:11.2.0
portField: HTTP_PORT
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "3001"
    required: true
  - key: ADMIN_USER
    label: {vi: Tài khoản quản trị, en: Admin user}
    type: text
    default: "admin"
    required: true
  - key: ADMIN_PASSWORD
    label: {vi: Mật khẩu quản trị, en: Admin password}
    type: password
    generate: true
compose: |
  services:
    grafana:
      image: grafana/grafana:11.2.0
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        GF_SECURITY_ADMIN_USER: ${ADMIN_USER}
        GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ports:
        - "${HTTP_PORT}:3000"
      volumes:
        - data:/var/lib/grafana

  volumes:
    data:
