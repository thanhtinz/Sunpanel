key: piwigo
name:
  vi: Piwigo
  en: Piwigo
description:
  vi: "Thư viện ảnh cho bộ sưu tập lớn: gắn thẻ, phân quyền theo album, tìm theo ngày chụp."
  en: "A photo gallery for large collections: tags, per-album permissions and date search."
category: media
website: https://piwigo.org
portField: HTTP_PORT
versions:
  - name: "16.4.0"
    images:
      - linuxserver/piwigo:16.4.0
      - mariadb:11
    values:
      IMAGE: "linuxserver/piwigo:16.4.0"
      DB_IMAGE: "mariadb:11"
  - name: "15.7.0"
    images:
      - linuxserver/piwigo:15.7.0
      - mariadb:11
    values:
      IMAGE: "linuxserver/piwigo:15.7.0"
      DB_IMAGE: "mariadb:11"
  - name: "14.5.0"
    images:
      - linuxserver/piwigo:14.5.0
      - mariadb:11
    values:
      IMAGE: "linuxserver/piwigo:14.5.0"
      DB_IMAGE: "mariadb:11"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8487"
    required: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: Asia/Ho_Chi_Minh
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - config:/config

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: piwigo
        MARIADB_USER: piwigo
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "1"
      volumes:
        - db:/var/lib/mysql

  volumes:
    config:
    db:
