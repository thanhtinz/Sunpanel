key: emby
name:
  vi: Emby
  en: Emby
description:
  vi: "Máy chủ phim nhạc với bộ chuyển mã mạnh và ứng dụng đa nền tảng."
  en: "A media server with strong transcoding and apps on every platform."
category: media
website: https://emby.media
portField: HTTP_PORT
versions:
  - name: "4.10.0.25"
    images:
      - emby/embyserver:4.10.0.25
    values:
      IMAGE: "emby/embyserver:4.10.0.25"
  - name: "4.9.5.0"
    images:
      - emby/embyserver:4.9.5.0
    values:
      IMAGE: "emby/embyserver:4.9.5.0"
  - name: "4.8.11.0"
    images:
      - emby/embyserver:4.8.11.0
    values:
      IMAGE: "emby/embyserver:4.8.11.0"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8097"
    required: true
  - key: MEDIA_DIR
    label: {vi: Thư mục phim nhạc, en: Media folder}
    help:
      vi: "Thư mục sẵn có trên máy chủ, được gắn vào ứng dụng."
      en: "An existing folder on the host, mounted into the app."
    type: text
    default: "/srv/media"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8096"
      volumes:
        - config:/config
        - ${MEDIA_DIR}:/mnt/media

  volumes:
    config:
