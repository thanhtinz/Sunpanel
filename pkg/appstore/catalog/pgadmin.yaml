key: pgadmin
name:
  vi: pgAdmin
  en: pgAdmin
description:
  vi: "Giao diện quản trị PostgreSQL đầy đủ: truy vấn, sơ đồ bảng, sao lưu."
  en: "The full PostgreSQL admin UI: queries, schema diagrams and backups."
category: database
website: https://pgadmin.org
portField: HTTP_PORT
versions:
  - name: "9.17"
    images:
      - dpage/pgadmin4:9.17
    values:
      IMAGE: "dpage/pgadmin4:9.17"
  - name: "8.14.0"
    images:
      - dpage/pgadmin4:8.14.0
    values:
      IMAGE: "dpage/pgadmin4:8.14.0"
  - name: "7.8"
    images:
      - dpage/pgadmin4:7.8
    values:
      IMAGE: "dpage/pgadmin4:7.8"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8093"
    required: true
  - key: ADMIN_EMAIL
    label: {vi: Email đăng nhập, en: Login email}
    type: text
    default: "admin@example.com"
    required: true
  - key: ADMIN_PASSWORD
    label: {vi: Mật khẩu, en: Password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        PGADMIN_DEFAULT_EMAIL: "${ADMIN_EMAIL}"
        PGADMIN_DEFAULT_PASSWORD: "${ADMIN_PASSWORD}"
        PGADMIN_LISTEN_PORT: "80"
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - data:/var/lib/pgadmin

  volumes:
    data:
