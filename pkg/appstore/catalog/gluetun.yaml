key: gluetun
name:
  vi: Gluetun
  en: Gluetun
description:
  vi: "Container VPN để các container khác đi mạng qua nó — mọi lưu lượng ra ngoài đều được bọc."
  en: "A VPN container other containers route through, wrapping all their outbound traffic."
category: security
website: https://github.com/qdm12/gluetun
versions:
  - name: "3.41.3"
    images:
      - qmcgaw/gluetun:v3.41.3
    values:
      IMAGE: "qmcgaw/gluetun:v3.41.3"
  - name: "3.40.4"
    images:
      - qmcgaw/gluetun:v3.40.4
    values:
      IMAGE: "qmcgaw/gluetun:v3.40.4"
  - name: "3.39.1"
    images:
      - qmcgaw/gluetun:v3.39.1
    values:
      IMAGE: "qmcgaw/gluetun:v3.39.1"
fields:
  - key: VPN_SERVICE_PROVIDER
    label: {vi: Nhà cung cấp VPN, en: VPN provider}
    type: select
    default: "mullvad"
    options:
      - value: "mullvad"
        label: {vi: Mullvad, en: Mullvad}
      - value: "protonvpn"
        label: {vi: Proton VPN, en: Proton VPN}
      - value: "nordvpn"
        label: {vi: NordVPN, en: NordVPN}
      - value: "custom"
        label: {vi: Tự cấu hình, en: Custom}
  - key: WIREGUARD_PRIVATE_KEY
    label: {vi: Khóa riêng WireGuard, en: WireGuard private key}
    type: password
    generate: true
  - key: SERVER_COUNTRIES
    label: {vi: Quốc gia máy chủ, en: Server countries}
    type: text
    default: "Singapore"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      environment:
        VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER}"
        VPN_TYPE: "wireguard"
        WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY}"
        SERVER_COUNTRIES: "${SERVER_COUNTRIES}"
        TZ: "Asia/Ho_Chi_Minh"
      volumes:
        - config:/gluetun

  volumes:
    config:
