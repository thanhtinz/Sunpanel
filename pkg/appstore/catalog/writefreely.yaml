key: writefreely
name:
  vi: WriteFreely
  en: WriteFreely
description:
  vi: "Nền tảng viết tối giản, không đếm lượt thích, không bình luận — chỉ có chữ."
  en: "A minimalist writing platform: no likes, no comments, just the text."
category: website
website: https://writefreely.org
portField: HTTP_PORT
versions:
  - name: "0.12.0"
    images:
      - writeas/writefreely:0.12.0
    values:
      IMAGE: "writeas/writefreely:0.12.0"
  - name: "0.10.0"
    images:
      - writeas/writefreely:0.10.0
    values:
      IMAGE: "writeas/writefreely:0.10.0"
  - name: "0.9.1"
    images:
      - writeas/writefreely:0.9.1
    values:
      IMAGE: "writeas/writefreely:0.9.1"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "3203"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
      volumes:
        - data:/data
        - config:/go/keys

  volumes:
    data:
    config:
