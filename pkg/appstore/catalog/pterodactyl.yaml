key: pterodactyl
name:
  vi: Pterodactyl
  en: Pterodactyl
description:
  vi: "Bảng điều khiển máy chủ trò chơi: tạo, cấp phát và giao quyền quản lý cho từng người."
  en: "A game server control panel: create instances, allocate resources and hand out access."
category: tool
website: https://pterodactyl.io
portField: HTTP_PORT
versions:
  - name: "1.15.1"
    images:
      - ghcr.io/pterodactyl/panel:v1.15.1
      - mariadb:11
      - redis:7-alpine
    values:
      IMAGE: "ghcr.io/pterodactyl/panel:v1.15.1"
      DB_IMAGE: "mariadb:11"
      REDIS_IMAGE: "redis:7-alpine"
  - name: "1.14.1"
    images:
      - ghcr.io/pterodactyl/panel:v1.14.1
      - mariadb:11
      - redis:7-alpine
    values:
      IMAGE: "ghcr.io/pterodactyl/panel:v1.14.1"
      DB_IMAGE: "mariadb:11"
      REDIS_IMAGE: "redis:7-alpine"
  - name: "1.13.0"
    images:
      - ghcr.io/pterodactyl/panel:v1.13.0
      - mariadb:11
      - redis:7-alpine
    values:
      IMAGE: "ghcr.io/pterodactyl/panel:v1.13.0"
      DB_IMAGE: "mariadb:11"
      REDIS_IMAGE: "redis:7-alpine"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8647"
    required: true
  - key: APP_URL_VALUE
    label: {vi: Địa chỉ trang, en: Site URL}
    type: text
    default: "http://localhost:8647"
    required: true
  - key: SECRET_KEY
    label: {vi: Khóa ứng dụng, en: App key}
    help:
      vi: "Laravel yêu cầu khóa dạng base64:… dài 32 byte; xem tài liệu dự án để sinh."
      en: "Laravel wants a base64:… key of 32 bytes; see the project docs to generate one."
    type: password
    generate: true
  - key: DB_PASSWORD
    label: {vi: Mật khẩu cơ sở dữ liệu, en: Database password}
    type: password
    generate: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      depends_on:
        - db
        - redis
      environment:
        APP_URL: ${APP_URL_VALUE}
        APP_KEY: ${SECRET_KEY}
        APP_TIMEZONE: Asia/Ho_Chi_Minh
        DB_HOST: db
        DB_PORT: "3306"
        DB_DATABASE: panel
        DB_USERNAME: pterodactyl
        DB_PASSWORD: ${DB_PASSWORD}
        CACHE_DRIVER: redis
        SESSION_DRIVER: redis
        QUEUE_DRIVER: redis
        REDIS_HOST: redis
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - var:/app/var
        - logs:/app/storage/logs

    redis:
      image: ${REDIS_IMAGE}
      container_name: ${CONTAINER_NAME}-redis
      restart: unless-stopped

    db:
      image: ${DB_IMAGE}
      container_name: ${CONTAINER_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: panel
        MARIADB_USER: pterodactyl
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "1"
      volumes:
        - db:/var/lib/mysql

  volumes:
    var:
    logs:
    db:
