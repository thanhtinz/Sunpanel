key: cadvisor
name:
  vi: cAdvisor
  en: cAdvisor
description:
  vi: "Đo mức dùng CPU, RAM và mạng của từng container, xuất số liệu cho Prometheus."
  en: "Measures per-container CPU, memory and network use, and exports it to Prometheus."
category: monitoring
website: https://github.com/google/cadvisor
portField: HTTP_PORT
versions:
  - name: "0.49.1"
    images:
      - gcr.io/cadvisor/cadvisor:v0.49.1
    values:
      IMAGE: "gcr.io/cadvisor/cadvisor:v0.49.1"
fields:
  - key: HTTP_PORT
    label: {vi: Cổng web, en: Web port}
    type: port
    default: "8147"
    required: true
compose: |
  services:
    app:
      image: ${IMAGE}
      container_name: ${CONTAINER_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
      volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
